    </rect>
    <rect x="0" y="0" width="460" height="36" fill="#1e1f29" fill-opacity="0.9"/>
    <circle cx="26" cy="18" r="5" fill="#ff5555"/>
    <circle cx="44" cy="18" r="5" fill="#f1fa8c"/>
    <circle cx="62" cy="18" r="5" fill="#50fa7b"/>
    <text x="230" y="23" font-size="12" fill="#6272a4" text-anchor="middle">shahnawaz@chiniot: ~/dev</text>
    <rect x="0" y="0" width="460" height="2" fill="url(#tline)"/>
    <g font-size="13">
      <g clip-path="url(#l0)">
        <text x="34" y="96" fill="#f1fa8c">$ 
          <tspan fill="#50fa7b">whoami</tspan></text>
      </g>
      <g clip-path="url(#l1)">
        <text x="34" y="120" fill="#50fa7b">shah nawaz</text>
      </g>
      <g clip-path="url(#l2)">

<svg 
  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="ui-monospace,'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="tshell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#21222c"/>
    </linearGradient>
    <linearGradient id="tline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bd93f9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="tglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="twin">
      <rect x="0" y="0" width="460" height="330" rx="12"/>
    </clipPath>
    <clipPath id="l0">
      <rect x="34" y="79" height="22" width="0">
        <animate attributeName="width" values="0;0;66;66;0;0" keyTimes="0;0.025;0.06;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l1">
      <rect x="34" y="103" height="22" width="0">
        <animate attributeName="width" values="0;0;81;81;0;0" keyTimes="0;0.075;0.12;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l2">
      <rect x="34" y="127" height="22" width="0">
        <animate attributeName="width" values="0;0;105;105;0;0" keyTimes="0;0.13;0.17;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l3">
      <rect x="34" y="151" height="22" width="0">
        <animate attributeName="width" values="0;0;183;183;0;0" keyTimes="0;0.18;0.235;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l4">
      <rect x="34" y="175" height="22" width="0">
        <animate attributeName="width" values="0;0;198;198;0;0" keyTimes="0;0.245;0.31;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l5">
      <rect x="34" y="199" height="22" width="0">
        <animate attributeName="width" values="0;0;105;105;0;0" keyTimes="0;0.31;0.35;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l6">
      <rect x="34" y="223" height="22" width="0">
        <animate attributeName="width" values="0;0;199;199;0;0" keyTimes="0;0.36;0.42;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l7">
      <rect x="34" y="247" height="22" width="0">
        <animate attributeName="width" values="0;0;66;66;0;0" keyTimes="0;0.425;0.455;0.90;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="l8">

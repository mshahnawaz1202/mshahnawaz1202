    <rect width="8" height="16" fill="#50fa7b" filter="url(#tglow)">
      <animate attributeName="x" calcMode="discrete" values="99;114;138;216;231;138;232;99;232;232" keyTimes="0.025;0.075;0.13;0.18;0.245;0.31;0.36;0.425;0.47;0.93" dur="20.0s" repeatCount="indefinite"/>
      <animate attributeName="y" calcMode="discrete" values="83;107;131;155;179;203;227;251;275;275" keyTimes="0.025;0.075;0.13;0.18;0.245;0.31;0.36;0.425;0.47;0.93" dur="20.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="0.75" y="0.75" width="458.5" height="328.5" rx="12" fill="none" stroke="#6272a4" stroke-opacity="0.45" stroke-width="1.5"/>

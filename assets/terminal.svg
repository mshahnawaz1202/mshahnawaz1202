  <g clip-path="url(#twin)">
    <rect width="460" height="330" fill="url(#tshell)"/>
    <g opacity="0.08" stroke="#6272a4" stroke-width="1">
      <path d="M0 70H460M0 120H460M0 170H460M0 220H460M0 270H460"/>
      <path d="M90 0V330M180 0V330M270 0V330M360 0V330"/>
    </g>
    <rect x="0" width="460" height="80" fill="url(#tscan)">

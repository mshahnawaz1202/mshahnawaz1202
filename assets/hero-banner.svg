<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muhammad Shah Nawaz - Software Engineer Hero Banner">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0d0d2b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="40%" style="stop-color:#7b2fff"/>
      <stop offset="100%" style="stop-color:#00ffcc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#7b2fff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:0.2"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cometGlow" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect width="900" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="900" height="320" fill="url(#bgGrad)"/>

    <!-- Grid lines - horizontal -->
    <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="280" x2="900" y2="280"/>
    </g>
    <!-- Grid lines - vertical -->
    <g opacity="0.06" stroke="#7b2fff" stroke-width="0.5">
      <line x1="90" y1="0" x2="90" y2="320"/>
      <line x1="180" y1="0" x2="180" y2="320"/>
      <line x1="270" y1="0" x2="270" y2="320"/>
      <line x1="360" y1="0" x2="360" y2="320"/>
      <line x1="450" y1="0" x2="450" y2="320"/>
      <line x1="540" y1="0" x2="540" y2="320"/>
      <line x1="630" y1="0" x2="630" y2="320"/>
      <line x1="720" y1="0" x2="720" y2="320"/>
      <line x1="810" y1="0" x2="810" y2="320"/>
    </g>

    <!-- Central glow blob -->
    <ellipse cx="450" cy="160" rx="280" ry="140" fill="url(#glowCenter)"/>

    <!-- === ORBITAL SYSTEM (right side) === -->
    <!-- Outer orbit ring -->
    <ellipse cx="720" cy="160" rx="130" ry="50" fill="none" stroke="url(#ringGrad1)" stroke-width="1" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 720 160" to="360 720 160" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Middle orbit ring -->
    <ellipse cx="720" cy="160" rx="90" ry="34" fill="none" stroke="url(#ringGrad2)" stroke-width="1" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 720 160" to="0 720 160" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Inner orbit ring -->
    <ellipse cx="720" cy="160" rx="55" ry="20" fill="none" stroke="#00ffcc" stroke-width="0.8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 720 160" to="360 720 160" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Central orb -->
    <circle cx="720" cy="160" r="18" fill="#0a0a1a" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="720" cy="160" r="10" fill="url(#orbGlow)" opacity="0.8">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="160" r="5" fill="#00d4ff" filter="url(#strongGlow)"/>

    <!-- Orbiting dots on outer ring -->
    <circle r="4" fill="#00d4ff" filter="url(#glow)">
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath>
          <animateTransform attributeName="transform" type="rotate" from="0 720 160" to="360 720 160" dur="12s" repeatCount="indefinite"/>
        </mpath>
      </animateMotion>
      <animateMotion path="M 850,160 A 130,50 0 1,1 849.9,160" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting dot 1 - outer -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 720 160" to="360 720 160" dur="12s" repeatCount="indefinite"/>
      <circle cx="850" cy="160" r="4" fill="#00d4ff" filter="url(#glow)"/>
    </g>
    <!-- Orbiting dot 2 - outer, offset -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 720 160" to="540 720 160" dur="12s" repeatCount="indefinite"/>
      <circle cx="850" cy="160" r="3" fill="#7b2fff" filter="url(#glow)"/>
    </g>
    <!-- Orbiting dot - middle ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90 720 160" to="-270 720 160" dur="8s" repeatCount="indefinite"/>
      <circle cx="810" cy="160" r="3.5" fill="#00ffcc" filter="url(#glow)"/>
    </g>
    <!-- Orbiting dot - middle ring 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="270 720 160" to="-90 720 160" dur="8s" repeatCount="indefinite"/>
      <circle cx="810" cy="160" r="2.5" fill="#7b2fff" filter="url(#glow)"/>
    </g>
    <!-- Orbiting dot - inner ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="45 720 160" to="405 720 160" dur="5s" repeatCount="indefinite"/>
      <circle cx="775" cy="160" r="2.5" fill="#00ffcc" filter="url(#glow)"/>
    </g>

    <!-- === COMET 1 === -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.2;0.8;1" dur="7s" repeatCount="indefinite"/>
      <line stroke="url(#cometGlow)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="-60;300" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="20;60" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-10;350" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="20;60" dur="7s" repeatCount="indefinite"/>
      </line>
      <circle r="3" fill="#00ffcc" filter="url(#glow)">
        <animate attributeName="cx" values="-10;350" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="20;60" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- === COMET 2 === -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.2;0.35;0.45;0.85;1" dur="11s" repeatCount="indefinite"/>
      <line stroke="#7b2fff" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
        <animate attributeName="x1" values="900;500" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="280;240" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="960;560" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="280;240" dur="11s" repeatCount="indefinite"/>
      </line>
      <circle r="2.5" fill="#7b2fff" filter="url(#glow)">
        <animate attributeName="cx" values="900;500" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;240" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- === PARTICLES === -->
    <!-- Floating particles scattered across the banner -->
    <circle cx="50" cy="30" r="1.5" fill="#00d4ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;26;30" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="70" r="1" fill="#7b2fff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="20" r="1.5" fill="#00ffcc" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;15;20" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="290" r="1" fill="#00d4ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="55" r="1.5" fill="#7b2fff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="295" r="1" fill="#00ffcc" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="15" r="2" fill="#00d4ff" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="15;10;15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="260" r="1.5" fill="#7b2fff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="300" r="1" fill="#00d4ff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="130" r="1.5" fill="#00ffcc" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- HUD corner brackets -->
    <!-- Top-left -->
    <path d="M16,16 L40,16 M16,16 L16,40" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
    <!-- Top-right -->
    <path d="M884,16 L860,16 M884,16 L884,40" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
    <!-- Bottom-left -->
    <path d="M16,304 L40,304 M16,304 L16,280" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
    <!-- Bottom-right -->
    <path d="M884,304 L860,304 M884,304 L884,280" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>

    <!-- HUD status dots (top left area) -->
    <circle cx="36" cy="30" r="3" fill="#00ffcc" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="30" r="3" fill="#00d4ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="64" cy="30" r="3" fill="#7b2fff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- HUD scan line -->
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00d4ff" stroke-width="1.5" opacity="0">
      <animate attributeName="y1" values="0;320;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;320;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.3;0.1;0;0;0" keyTimes="0;0.05;0.25;0.5;0.6;0.9;1" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- === MAIN TEXT CONTENT === -->
    <!-- System ID tag -->
    <text x="80" y="72" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff" opacity="0.7" letter-spacing="3">ENGINEER.SYS // v2.0.26</text>

    <!-- Name - large gradient -->
    <text x="80" y="142" font-family="'Courier New', monospace" font-size="48" font-weight="900" fill="url(#nameGrad)" filter="url(#textGlow)" letter-spacing="1">
      SHAH NAWAZ
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Decorative separator line under name -->
    <rect x="80" y="152" width="520" height="1.5" fill="url(#lineGrad)"/>

    <!-- Title line -->
    <text x="80" y="185" font-family="'Courier New', monospace" font-size="15" fill="#00d4ff" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="300" y="185" font-family="'Courier New', monospace" font-size="15" fill="#7b2fff" letter-spacing="2"> · SYSTEMS &amp; MOBILE · AI/ML</text>

    <!-- Tagline -->
    <text x="80" y="215" font-family="'Courier New', monospace" font-size="11.5" fill="#8892a4" letter-spacing="1">Design before code. Architecture before features. Clarity before cleverness.</text>

    <!-- Status indicators -->
    <g transform="translate(80, 246)">
      <circle cx="0" cy="0" r="4" fill="#00ffcc" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="4" font-family="'Courier New', monospace" font-size="9.5" fill="#00ffcc" letter-spacing="1">AVAILABLE FOR INTERNSHIPS</text>

      <circle cx="220" cy="0" r="4" fill="#00d4ff" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="232" y="4" font-family="'Courier New', monospace" font-size="9.5" fill="#00d4ff" letter-spacing="1">OPEN TO COLLABORATE</text>
    </g>

    <!-- Location + edu badge -->
    <text x="80" y="290" font-family="'Courier New', monospace" font-size="9" fill="#4a5568" letter-spacing="2">📍 CHINIOT, PK  ·  🎓 BS SE @ FAST-NUCES</text>

    <!-- HUD right-side data panel -->
    <g transform="translate(590, 230)" opacity="0.5">
      <text font-family="'Courier New', monospace" font-size="8" fill="#00d4ff" letter-spacing="1">
        <tspan x="0" dy="0">STACK::PYTHON</tspan>
        <tspan x="0" dy="14">STACK::KOTLIN</tspan>
        <tspan x="0" dy="14">STACK::C++</tspan>
      </text>
    </g>

    <!-- Border frame -->
    <rect x="2" y="2" width="896" height="316" rx="14" fill="none" stroke="#1a1a3e" stroke-width="2"/>
    <rect x="0" y="0" width="900" height="320" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  </g>
</svg>

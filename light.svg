<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="290" viewBox="0 0 1180 290"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
     role="img" aria-label="Muhammad Shah Nawaz — Full-Stack Developer">

  <defs>
    <linearGradient id="acc_l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="vig_l" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="grid_l" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#CBD5E1" stroke-width="0.4"/>
    </pattern>
  </defs>

  <rect width="1180" height="290" fill="#F8FAFC"/>
  <rect width="1180" height="290" fill="url(#grid_l)" opacity="0.5"/>
  <rect width="1180" height="290" fill="url(#vig_l)"/>

  <!-- Top bar -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="url(#acc_l)" stroke-width="2.5" opacity="0.9"/>

  <!-- Side gutter -->
  <line x1="24" y1="32" x2="24" y2="258" stroke="#0891B2" stroke-width="1.5" opacity="0.22"/>
  <circle cx="24" cy="32" r="3.5" fill="#0891B2" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="258" r="3.5" fill="#7C3AED" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Prompt label -->
  <text x="44" y="50" font-size="10" letter-spacing="2.5" fill="#94A3B8" opacity="0">
    SYSTEM.INIT ···· STATUS: ONLINE ···· github.com/mshahnawaz1202
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
  </text>

  <!-- Name -->
  <text x="44" y="136" font-size="54" font-weight="700" fill="#0F172A" letter-spacing="-1.5" opacity="0">
    Muhammad Shah Nawaz
    <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.25s" fill="freeze"/>
  </text>

  <!-- Accent underline -->
  <rect x="44" y="144" width="0" height="3" rx="1.5" fill="url(#acc_l)" opacity="0.9">
    <animate attributeName="width" from="0" to="560" dur="0.75s" begin="0.6s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.25 0 0.1 1"/>
  </rect>

  <!-- Tagline -->
  <text x="44" y="178" font-size="16" fill="#475569" letter-spacing="0.4" opacity="0">
    <tspan fill="#0891B2">$</tspan>  Full-Stack Dev  ·  Data Scientist  ·  Problem Solver
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.75s" fill="freeze"/>
  </text>

  <!-- Cursor -->
  <rect x="424" y="163" width="10" height="18" rx="2" fill="#0891B2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.95s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" begin="1.0s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech pills -->
  <g font-size="10.5" font-weight="600" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.9s" fill="freeze"/>
    <rect x="44" y="202" width="72" height="24" rx="12" fill="rgba(5,150,105,0.1)" stroke="rgba(5,150,105,0.4)" stroke-width="1"/>
    <text x="80" y="218" text-anchor="middle" fill="#059669">Node.js</text>
    <rect x="126" y="202" width="64" height="24" rx="12" fill="rgba(8,145,178,0.1)" stroke="rgba(8,145,178,0.35)" stroke-width="1"/>
    <text x="158" y="218" text-anchor="middle" fill="#0891B2">Python</text>
    <rect x="200" y="202" width="54" height="24" rx="12" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
    <text x="227" y="218" text-anchor="middle" fill="#7C3AED">Java</text>
    <rect x="264" y="202" width="60" height="24" rx="12" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
    <text x="294" y="218" text-anchor="middle" fill="#6366F1">Kotlin</text>
    <rect x="334" y="202" width="46" height="24" rx="12" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="357" y="218" text-anchor="middle" fill="#7C3AED">C++</text>
    <rect x="390" y="202" width="102" height="24" rx="12" fill="rgba(217,119,6,0.1)" stroke="rgba(217,119,6,0.3)" stroke-width="1"/>
    <text x="441" y="218" text-anchor="middle" fill="#B45309">Data Science</text>
  </g>

  <!-- Terminal card -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.45s" fill="freeze"/>
    <rect x="808" y="44" width="340" height="204" rx="13" fill="#FFFFFF" stroke="rgba(8,145,178,0.22)" stroke-width="1"/>
    <rect x="808" y="44" width="340" height="32" rx="13" fill="#F1F5F9"/>
    <rect x="808" y="62" width="340" height="14" fill="#F1F5F9"/>
    <line x1="808" y1="76" x2="1148" y2="76" stroke="rgba(0,0,0,0.07)"/>
    <circle cx="830" cy="60" r="5.5" fill="#EF4444" opacity="0.65"/>
    <circle cx="848" cy="60" r="5.5" fill="#F59E0B" opacity="0.65"/>
    <circle cx="866" cy="60" r="5.5" fill="#10B981" opacity="0.65"/>
    <text x="886" y="65" font-size="10" fill="#94A3B8">~  mshahnawaz1202</text>
    <text x="826" y="102" font-size="11" fill="#94A3B8"><tspan fill="#0891B2">›</tspan> whoami</text>
    <text x="826" y="120" font-size="11" fill="#0F172A">  Muhammad Shah Nawaz</text>
    <text x="826" y="142" font-size="11" fill="#94A3B8"><tspan fill="#0891B2">›</tspan> cat stack.txt</text>
    <text x="826" y="160" font-size="11" fill="#475569">  MERN · Python · Java · Kotlin</text>
    <text x="826" y="182" font-size="11" fill="#94A3B8"><tspan fill="#0891B2">›</tspan> ls projects/</text>
    <text x="826" y="200" font-size="11" fill="#059669">  17 repos  ·  5 certs  ·  ∞ ideas</text>
    <text x="826" y="222" font-size="11" fill="#94A3B8"><tspan fill="#0891B2">›</tspan> <tspan fill="#0F172A">_</tspan></text>
  </g>

  <!-- Bottom bar -->
  <line x1="0" y1="288" x2="1180" y2="288" stroke="url(#acc_l)" stroke-width="1.5" opacity="0.6"/>
</svg>
